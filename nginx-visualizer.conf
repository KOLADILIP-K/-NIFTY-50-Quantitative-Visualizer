server {
    listen 80;
    server_name nifty.yourdomain.com; # Replace with your domain or IP

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nifty.yourdomain.com;

    # SSL Certificates (managed via Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/nifty.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nifty.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Gzip compression for fast loading of data JSON and HTML
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Cache static data JSON for 1 hour on clients
    location /nifty_3yr_data.json {
        proxy_pass http://127.0.0.1:8888/nifty_3yr_data.json;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
